name: workflow
on:
    push:
        branches:
            -   main
        paths-ignore:
            -   'README.md'

jobs:
    integration:
        name: Continuous Integration
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v3

            -   name: Lint code 
                run: echo "Linting repository"

            -   name: Run unit tests
                run: echo "Running unit tests"

    build-and-push-ecr-image:
        name: Continuous Delivery
        needs: integration
        runs-on: ubuntu-latest
        steps:
            -   name: Chechout code
                uses: actions/checkout@v3

            -   name: Install utilities
                run: |
                    sudo apt-get update
                    sudo apt-get install -y jq unzip

            -   name: Configure AWS credentials
                uses: aws-actions/configure-aws-credentials@v1
                with: 
                    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    aws-region: ${{ secrets.AWS_REGION }}
            
            -   name: Login to Amazon Eleastic Container Registry
                id: login-ecr
                uses: aws-actions/amazon-ecr-login@v1

            -   name: Build, tag and push image to Amazon ECR
                id: build-image
                env:
                    ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
                    IMAGE_TAG: latest
                run: |
                    IMAGE_NAME="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
                    docker build -t "$IMAGE_NAME" .
                    docker push "$IMAGE_NAME"
                        echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

    continuous-deployment:
            needs: build-and-push-ecr-image
            runs-on: self-hosted
            steps:
            -   name: Checkout
                uses: actions/checkout@v3

            -   name: Configure AWS credentials
                uses: aws-actions/configure-aws-credentials@v1
                with: 
                    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    aws-region: ${{ secrets.AWS_REGION }}

            -   name: Login to Amazon Elastic Container Registry
                id: login-ecr
                uses: aws-actions/amazon-ecr-login@v1

            -   name: Pull latest images
                run: |
                    docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

            -   name: Stop and remove container if running
                run: |
                    docker rm -f network-security || true

            -   name: Run docker image to serve users
                run: |
                    docker run -d -p 8080:8080 --ipc="host" --name=network-security \
                    -e 'AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' \
                    -e 'AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
                    -e 'AWS_REGION=${{ secrets.AWS_REGION }}' \
                    ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

            -   name: Clean previous images and containers
                run: |
                    docker system prune -f